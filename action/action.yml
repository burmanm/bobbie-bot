# review-bot GitHub Action (A-8, C-2). One action for every job of the
# reference workflow (workflows/review-bot.yml); `command` picks the job's
# part. Pin it by full commit SHA. Setup and the security model:
# docs/installing.md.
#
# gate, setup, review, complete-check, remove-label run in a locked-down container:
# the prebuilt image named by digest in action/image.lock (published by
# .github/workflows/action-image.yml with provenance), so the jobs download
# nothing but that image (C-4 "The action image"). Without a digest there,
# or with `image: build`, the image is built from action/Dockerfile (Node,
# pinned dependencies, pinned and checksum-verified rg, fd, gh and git;
# PI_OFFLINE=1). prepare runs on the runner with Go and never sees a secret.
# setup installs the agent directory's packages in a job with no secret and
# no token (F-7, C-4); it is the only container that downloads anything.
name: review-bot
description: Automated pull-request review (gate, prepare, setup, review, complete-check, remove-label)
author: review-bot

inputs:
  command:
    description: "gate | prepare | setup | review | complete-check | remove-label"
    required: true
  token:
    description: >-
      GitHub token for this job: the job's GITHUB_TOKEN, or an App
      installation token from actions/create-github-app-token. Use the same
      identity in gate, review and complete-check (a check run can only be
      completed by the identity that created it). setup takes none.
    default: ""
  repo:
    description: owner/name of the repository under review
    default: ${{ github.repository }}
  name:
    description: Reviewer name; the check run is ai-review/<name>
    default: main
  pr:
    description: Pull request number (all commands but gate; gate takes it for manual dispatch)
    default: ""
  head-sha:
    description: Head SHA the gate authorized (prepare, complete-check)
    default: ""
  base-sha:
    description: Base SHA (prepare)
    default: ""
  agent-dir:
    description: >-
      gate, setup, review: the operator's pi agent directory (F-7), a
      directory path in the repository holding settings.json (pi's keys,
      packages, enabledModels, codemode and reviewBot) and models.json. Read
      from the default branch's head, or from agent-dir-repo; never from the
      PR. The gate fetches it; the workflow passes it to the setup job, which
      installs its packages, and passes the result to the review job, as
      artifacts. Empty: none.
    default: ""
  agent-dir-repo:
    description: >-
      gate: take agent-dir from this repository at a pinned commit instead,
      owner/name@<40-hex SHA> (an organization configuration repository).
      The gate's token must be able to read it.
    default: ""
  auth-label:
    description: >-
      Authorization label for PRs from authors without write access (C-4,
      Q-10). Empty: reviewBot.authorization.label in settings.json, else
      ai-review/approved
    default: ""
  auth-label-lifetime:
    description: "per-push (removed on the author's next push) or per-pr (kept). Empty: settings.json, else per-push"
    default: ""
  ci-require:
    description: >-
      gate: wait for CI before reviewing (C-9). off; required (the base
      branch's required status checks minus ai-review/*); or check-run,
      status-context or workflow names, comma- or newline-separated. Over
      reviewBot.ci in settings.json; ci.require in .review/review-bot.yaml on
      the base branch replaces it (the repository's own policy).
    default: ""
  ci-on-failure:
    description: "gate: skip (complete the check as skipped) or review (review anyway and say so) when required CI failed"
    default: ""
  ci-timeout:
    description: "gate: how long a PR waits for CI before its check is completed as skipped, e.g. 6h"
    default: ""
  ignore-ci:
    description: "gate, manual dispatch only: 'true' reviews without waiting for CI"
    default: ""
  waiting:
    description: "review: the gate's waiting output (A-6), recorded in the run record"
    default: ""
  no-history:
    description: "review: 'true' turns off git_log/git_blame/git_show/search_issues (private repositories without contents: read and issues: read, C-4)"
    default: ""
  image:
    description: >-
      The action image. Empty: the digest in action/image.lock, else built
      from action/Dockerfile. "build": always build. Otherwise a reference
      pinned by digest, <registry>/<name>@sha256:<64 hex>.
    default: ""
  models:
    description: >-
      Role→model map, one per line: reviewer=<provider>/<id>[:<thinking>],
      verifier=... (C-6). Replaces reviewBot.roles in settings.json.
      .review/review-bot.yaml on the base branch can only pick among
      enabledModels in settings.json; without that list it cannot change a model.
    default: ""
  thinking:
    description: "One per line: <role>=off|minimal|low|medium|high|xhigh|max (over a :suffix, as pi's --thinking)"
    default: ""
  providers:
    description: "OpenRouter only, one per line: <role>=<provider>,<provider>"
    default: ""
  max-cost:
    description: >-
      Run spend cap in USD, over reviewBot.limits.runCostUsd in settings.json
      (per-step limits go there). .review/review-bot.yaml can only lower it.
    default: ""
  timeout-minutes:
    description: >-
      The review step's own time limit. Set the step's timeout-minutes to the
      same value. The pipeline's run deadline is capped three minutes inside
      it (--max-run-timeout), so a slow review publishes a partial result and
      completes its check; a lower runTimeoutSeconds in settings.json or the
      YAML still applies. The action stops the container a minute before the
      limit as a last resort.
    default: "40"
  provider-env:
    description: Names of environment variables holding provider keys, passed to the review container only
    default: OPENROUTER_API_KEY
  outcome:
    description: "complete-check: how the review step ended (steps.<id>.outcome)"
    default: ""
  go-version:
    description: Go toolchain for the prepare job's go mod download (pin it to match the repository's go.mod)
    default: stable
  go-modules:
    description: Directories in the head tree with a go.mod, space-separated
    default: "."
  goproxy:
    description: The only module proxy prepare may use (one https URL; no direct mode)
    default: https://proxy.golang.org
  modcache-max-mb:
    description: The module cache is dropped above this size
    default: "3072"
  work-dir:
    description: Working directory shared by the steps of one job (default $RUNNER_TEMP/review-bot)
    default: ""

outputs:
  review:
    description: "gate: 'true' when the PR is to be reviewed"
    value: ${{ steps.run.outputs.review }}
  remove-label:
    description: "gate: 'true' when the authorization label is to be removed"
    value: ${{ steps.run.outputs.remove-label }}
  decision:
    description: "gate: review | skip | ignore"
    value: ${{ steps.run.outputs.decision }}
  reason:
    description: "gate: one line"
    value: ${{ steps.run.outputs.reason }}
  pr:
    description: "gate: PR number"
    value: ${{ steps.run.outputs.pr }}
  head-sha:
    description: "gate: head SHA that was authorized"
    value: ${{ steps.run.outputs.head-sha }}
  base-sha:
    description: "gate: base SHA"
    value: ${{ steps.run.outputs.base-sha }}
  label:
    description: "gate: the authorization label in effect (after .review/review-bot.yaml)"
    value: ${{ steps.run.outputs.label }}
  waiting:
    description: "gate: one JSON line for the review job's run record (A-6 Waiting), when the decision is review"
    value: ${{ steps.run.outputs.waiting }}

runs:
  using: composite
  steps:
    # ---- prepare: no secrets, no container -----------------------------
    - name: Set up Go
      if: inputs.command == 'prepare'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        # C-4: a pull_request_target job must not write the base branch's cache scope.
        cache: false
    - name: Prepare snapshots
      if: inputs.command == 'prepare'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RB_REPO: ${{ inputs.repo }}
        RB_PR: ${{ inputs.pr }}
        RB_BASE_SHA: ${{ inputs.base-sha }}
        RB_HEAD_SHA: ${{ inputs.head-sha }}
        RB_GO_MODULES: ${{ inputs.go-modules }}
        RB_GOPROXY: ${{ inputs.goproxy }}
        RB_MODCACHE_MAX_MB: ${{ inputs.modcache-max-mb }}
        RB_WORK_DIR: ${{ inputs.work-dir }}
      run: RB_WORK="${RB_WORK_DIR:-$RUNNER_TEMP/review-bot}" "$GITHUB_ACTION_PATH/prepare.sh"

    # ---- everything else: in the action image --------------------------
    - name: Get the review-bot image
      if: inputs.command != 'prepare'
      shell: bash
      env:
        RB_IMAGE: ${{ inputs.image }}
      run: '"$GITHUB_ACTION_PATH/run.sh" build'
    - name: Run review-bot ${{ inputs.command }}
      id: run
      if: inputs.command != 'prepare'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RB_COMMAND: ${{ inputs.command }}
        RB_REPO: ${{ inputs.repo }}
        RB_NAME: ${{ inputs.name }}
        RB_PR: ${{ inputs.pr }}
        RB_HEAD_SHA: ${{ inputs.head-sha }}
        RB_AUTH_LABEL: ${{ inputs.auth-label }}
        RB_AUTH_LIFETIME: ${{ inputs.auth-label-lifetime }}
        RB_AGENT_DIR: ${{ inputs.agent-dir }}
        RB_AGENT_DIR_REPO: ${{ inputs.agent-dir-repo }}
        RB_MODELS: ${{ inputs.models }}
        RB_THINKING: ${{ inputs.thinking }}
        RB_PROVIDERS: ${{ inputs.providers }}
        RB_MAX_COST: ${{ inputs.max-cost }}
        RB_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        RB_PROVIDER_ENV: ${{ inputs.provider-env }}
        RB_OUTCOME: ${{ inputs.outcome }}
        RB_CI_REQUIRE: ${{ inputs.ci-require }}
        RB_CI_ON_FAILURE: ${{ inputs.ci-on-failure }}
        RB_CI_TIMEOUT: ${{ inputs.ci-timeout }}
        RB_IGNORE_CI: ${{ inputs.ignore-ci }}
        RB_WAITING: ${{ inputs.waiting }}
        RB_NO_HISTORY: ${{ inputs.no-history }}
        RB_WORK_DIR: ${{ inputs.work-dir }}
      run: '"$GITHUB_ACTION_PATH/run.sh" run'
