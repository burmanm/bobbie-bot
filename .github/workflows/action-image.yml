# Builds and publishes the review-bot action image (C-4 "The action image",
# R-2) to GitHub Container Registry, with build provenance, and prints the
# line for action/image.lock.
#
# Manual only: nothing is built or published until someone with write access
# runs it, and only from the default branch. The image is multi-arch
# (amd64, arm64), built without cache from action/Dockerfile, whose own
# downloads are pinned and checksum-verified. Provenance: BuildKit SLSA
# provenance and an SBOM attached to the image, plus a GitHub artifact
# attestation (verify with `gh attestation verify oci://<image>@<digest>
# --owner <owner>`).
#
# Release procedure (docs/installing.md "The action image"): run this on the
# commit to release, put the printed line in action/image.lock in the next
# commit (and change nothing else the image contains: src/, pi-review/,
# package*.json, action/Dockerfile, action/tools.json,
# action/install-tools.mjs, action/debs.json, action/fetch-debs.mjs), and pin
# consumers to that commit.
name: action-image

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: action-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/review-bot-action
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation with the repository
    steps:
      - name: Check out this repository (the bot's own code, not a PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (registry names are lower case)
        id: name
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/review-bot-action" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: action/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: The line for action/image.lock
        shell: bash
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build"; exit 1; }
          {
            echo "### action/image.lock"
            echo
            echo "Built from \`$GITHUB_SHA\`. Put this line in action/image.lock:"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --owner $GITHUB_REPOSITORY_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"
