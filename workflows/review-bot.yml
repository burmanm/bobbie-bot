# review-bot reference workflow (C-2, C-4, C-5, S-8, S-9).
#
# Vendored into a repository as .github/workflows/review-bot.yml by the
# review-process sync tool. The file is the same in every repository: the
# sync tool sets the action's pinned commit SHA below, and each repository
# configures the bot with Actions variables and secrets (docs/installing.md).
#
# Jobs:
#   gate          no secrets; decides whether this event is reviewed, waits
#                 for CI and resumes or times out waiting PRs (C-9)
#   remove-label  no secrets; removes a stale authorization label
#   prepare       no secrets, contents:read; fetches trees, Go module cache
#   setup         no secrets, no token permissions; installs the agent
#                 directory's packages, lifecycle scripts off (F-7, C-4)
#   review        model key; reviews the prepared snapshot, never PR code,
#                 as the pi command /review-bot (F-3); downloads nothing
#
# pull_request_target, workflow_run, status and schedule all run this file
# from the DEFAULT/BASE branch with a token for the base repository. No job
# checks out or runs code from the PR.
#
# Configuration (F-7): REVIEW_BOT_AGENT_DIR names the operator's pi agent
# directory in this repository (settings.json, models.json), read from the
# DEFAULT branch's head, or from REVIEW_BOT_AGENT_DIR_REPO
# (owner/name@<commit SHA>); never from the PR. The gate fetches it through
# the API and hands it to the setup job, which installs the packages it lists
# and hands the result to the review job, as artifacts. The other variables
# override its settings, and .review/review-bot.yaml on the base branch can
# only narrow them.
name: review-bot

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number
      ignore-ci:
        description: Review without waiting for CI (C-9)
        type: boolean
        default: false
  # Waiting for CI (C-9), opt-in with ci.require in .review/review-bot.yaml.
  # These re-run the gate for PRs whose ai-review/<name> check is queued;
  # without a waiting PR they find nothing to do. The workflow list can be
  # narrowed to the repository's CI workflows; it must not match this one.
  workflow_run:
    workflows: ["**", "!review-bot"]
    types: [completed]
  status: # CI that reports commit statuses from outside Actions
  schedule:
    # The sweep: ends checks queued longer than ci.timeout, resumes missed ones.
    - cron: "17,47 * * * *"

permissions: {}

# One run per PR; a newer event cancels the one in flight (S-9). Label events
# for other labels get a group of their own so they cancel nothing. CI
# results (C-9) queue per head SHA and the sweep runs alone; neither cancels
# anything: the gate claims a waiting check before resuming it, and a run for
# a superseded head is stopped at publish (S-9).
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_run' || github.event_name == 'status')
        && format('review-bot-{0}-sha-{1}', vars.REVIEW_BOT_NAME || 'main', github.event.workflow_run.head_sha || github.event.sha)
        || github.event_name == 'schedule'
        && format('review-bot-{0}-sweep', vars.REVIEW_BOT_NAME || 'main')
        || github.event.action == 'labeled'
        && github.event.label.name != (vars.REVIEW_BOT_AUTH_LABEL || 'ai-review/approved')
        && format('review-bot-ignored-{0}', github.run_id)
        || format('review-bot-{0}-{1}', vars.REVIEW_BOT_NAME || 'main', github.event.pull_request.number || inputs.pr) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' }}

jobs:
  gate:
    # Label events for other labels, pending statuses and CI runs that cannot
    # be for a PR head never start a job.
    if: >-
      (github.event_name == 'pull_request_target'
        && (github.event.action != 'labeled'
            || github.event.label.name == (vars.REVIEW_BOT_AUTH_LABEL || 'ai-review/approved')))
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'status' && github.event.state != 'pending')
      || (github.event_name == 'workflow_run'
          && contains(fromJSON('["pull_request", "pull_request_target", "push"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # .review/review-bot.yaml at the base SHA (A-5)
      pull-requests: read
      checks: write # complete ai-review/<name> as skipped, or queue it (C-9)
      statuses: read # C-9: commit statuses of the head SHA
      actions: read # C-9: workflow runs, when ci.require names a workflow
    outputs:
      review: ${{ steps.gate.outputs.review }}
      remove-label: ${{ steps.gate.outputs.remove-label }}
      pr: ${{ steps.gate.outputs.pr }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      label: ${{ steps.gate.outputs.label }}
      waiting: ${{ steps.gate.outputs.waiting }}
    steps:
      - name: GitHub App token (C-5; only when REVIEW_BOT_APP_ID is set)
        id: app
        if: vars.REVIEW_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-statuses: read
          permission-actions: read
      - name: Authorize, and wait for CI (C-9)
        id: gate
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: gate
          token: ${{ steps.app.outputs.token || github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
          agent-dir-repo: ${{ vars.REVIEW_BOT_AGENT_DIR_REPO }}
          # Unset variables stay empty so settings.json shows through (F-7).
          # A label set only in settings.json also needs REVIEW_BOT_AUTH_LABEL:
          # the label filter above and the concurrency group read the variable.
          auth-label: ${{ vars.REVIEW_BOT_AUTH_LABEL }}
          auth-label-lifetime: ${{ vars.REVIEW_BOT_AUTH_LABEL_LIFETIME }}
          ci-require: ${{ vars.REVIEW_BOT_CI_REQUIRE }}
          ci-on-failure: ${{ vars.REVIEW_BOT_CI_ON_FAILURE }}
          ci-timeout: ${{ vars.REVIEW_BOT_CI_TIMEOUT }}
          pr: ${{ inputs.pr }}
          ignore-ci: ${{ inputs.ignore-ci }}
          image: ${{ vars.REVIEW_BOT_IMAGE }}
      - name: Hand the agent directory to the review job (F-7)
        if: vars.REVIEW_BOT_AGENT_DIR != '' && steps.gate.outputs.review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-agent-dir
          path: ${{ runner.temp }}/review-bot/agent/dir
          if-no-files-found: error
          # .npmrc next to a package.json is configuration too (F-7).
          include-hidden-files: true
          retention-days: 1
          overwrite: true
      - name: Upload gate run records (A-6, S-8)
        # One per check the gate completed itself (not authorized, CI failed or
        # timed out, superseded, stale); none when the review job takes over.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-record-${{ vars.REVIEW_BOT_NAME || 'main' }}-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-bot/gate-out/records/*.json
          if-no-files-found: ignore
          retention-days: ${{ vars.REVIEW_BOT_RECORD_RETENTION_DAYS || '90' }}
      - name: Complete the check if the gate failed (S-9)
        if: failure() && github.event.pull_request.head.sha != ''
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: complete-check
          image: ${{ vars.REVIEW_BOT_IMAGE }}
          token: ${{ steps.app.outputs.token || github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          outcome: failure

  remove-label:
    needs: gate
    if: needs.gate.outputs.remove-label == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # remove the authorization label (Q-10 per-push lifetime)
    steps:
      - name: GitHub App token
        id: app
        if: vars.REVIEW_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Remove the authorization label
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: remove-label
          image: ${{ vars.REVIEW_BOT_IMAGE }}
          token: ${{ steps.app.outputs.token || github.token }}
          pr: ${{ needs.gate.outputs.pr }}
          auth-label: ${{ needs.gate.outputs.label }}

  prepare:
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_PREPARE_TIMEOUT_MINUTES || '20') }}
    permissions:
      contents: read # tarballs of the base and head commits
    steps:
      # No App token here, ever: this job holds no secret.
      - name: Fetch trees and prepare the Go module cache
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: prepare
          token: ${{ github.token }}
          pr: ${{ needs.gate.outputs.pr }}
          base-sha: ${{ needs.gate.outputs.base-sha }}
          head-sha: ${{ needs.gate.outputs.head-sha }}
          go-version: ${{ vars.REVIEW_BOT_GO_VERSION || 'go.mod' }}
          go-modules: ${{ vars.REVIEW_BOT_GO_MODULES || '.' }}
      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-snapshot
          path: ${{ runner.temp }}/review-bot/out/snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  setup:
    needs: gate
    if: needs.gate.outputs.review == 'true' && vars.REVIEW_BOT_AGENT_DIR != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_SETUP_TIMEOUT_MINUTES || '15') }}
    # No token permissions and no secret (F-7, C-4): this job downloads and
    # unpacks the operator's packages, so it is the one that may use the
    # network for that. Lifecycle scripts stay off (review-bot setup).
    permissions: {}
    steps:
      - name: Download the agent directory (F-7; fetched by the gate, never from the PR)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-agent-dir
          path: ${{ runner.temp }}/review-bot/agent/dir
      - name: Install the packages it lists
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: setup
          image: ${{ vars.REVIEW_BOT_IMAGE }}
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
      - name: Hand the installed agent directory to the review job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-agent-installed
          path: ${{ runner.temp }}/review-bot/agent-out/agent-dir.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  review:
    needs: [gate, prepare, setup]
    # Runs when prepare or setup failed too, so the check is completed (S-9);
    # setup is skipped when there is no agent directory.
    if: ${{ !cancelled() && needs.gate.outputs.review == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_JOB_TIMEOUT_MINUTES || '50') }}
    permissions:
      pull-requests: write # the review, thread replies, thread resolution
      checks: write # ai-review/<name>
      # Private repositories (C-4): the history and issue tools need these two
      # as well. Uncomment both (and set REVIEW_BOT_HISTORY_READ=true for the
      # App token), or set REVIEW_BOT_NO_HISTORY=true. docs/installing.md.
      # contents: read
      # issues: read
    steps:
      - name: GitHub App token
        id: app
        if: vars.REVIEW_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-checks: write
          permission-contents: ${{ vars.REVIEW_BOT_HISTORY_READ == 'true' && 'read' || '' }}
          permission-issues: ${{ vars.REVIEW_BOT_HISTORY_READ == 'true' && 'read' || '' }}
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-snapshot
          path: ${{ runner.temp }}/review-bot/in
      - name: Download the agent directory with its packages (F-7; from the setup job)
        if: vars.REVIEW_BOT_AGENT_DIR != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-agent-installed
          path: ${{ runner.temp }}/review-bot/agent-in
      - name: Review
        id: review
        timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_TIMEOUT_MINUTES || '40') }}
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          command: review
          token: ${{ steps.app.outputs.token || github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          pr: ${{ needs.gate.outputs.pr }}
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
          models: ${{ vars.REVIEW_BOT_MODELS }}
          thinking: ${{ vars.REVIEW_BOT_THINKING }}
          providers: ${{ vars.REVIEW_BOT_PROVIDERS }}
          max-cost: ${{ vars.REVIEW_BOT_MAX_COST_USD }}
          timeout-minutes: ${{ vars.REVIEW_BOT_TIMEOUT_MINUTES || '40' }}
          waiting: ${{ needs.gate.outputs.waiting }}
          no-history: ${{ vars.REVIEW_BOT_NO_HISTORY }}
          image: ${{ vars.REVIEW_BOT_IMAGE }}
      - name: Complete the check if the review did not (S-9)
        if: always()
        uses: REVIEW_BOT_OWNER/review-bot/action@0000000000000000000000000000000000000000 # set by the sync tool
        with:
          command: complete-check
          image: ${{ vars.REVIEW_BOT_IMAGE }}
          token: ${{ steps.app.outputs.token || github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          head-sha: ${{ needs.gate.outputs.head-sha }}
          outcome: ${{ steps.review.outcome }}
      - name: Upload the run record and saved scripts (S-8, A-6, A-7)
        # runs/run-<id>/: 08-record.json and the other stage files, and
        # scripts.json when a role ran codemode scripts (F-7).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-record-${{ vars.REVIEW_BOT_NAME || 'main' }}-pr${{ needs.gate.outputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-bot/runs/*/*.json
          if-no-files-found: warn
          retention-days: ${{ vars.REVIEW_BOT_RECORD_RETENTION_DAYS || '90' }}
